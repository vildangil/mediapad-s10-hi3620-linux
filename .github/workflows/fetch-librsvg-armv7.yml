name: Fetch legacy ARMv7 SVG loader

on:
  workflow_dispatch:
  push:
    branches:
      - pmos-hwbringup-20260909
    paths:
      - '.github/workflows/fetch-librsvg-armv7.yml'

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and extract ARMv7 SVG loader
        run: |
          set -euxo pipefail
          # Alpine 3.21+ no longer carries the classic GdkPixbuf SVG plugin.
          # v3.20 librsvg still ships it and it links through librsvg-2.so.2.
          url='https://dl-cdn.alpinelinux.org/alpine/v3.20/community/armv7/librsvg-2.58.5-r0.apk'
          curl -fL --retry 4 "$url" -o librsvg.apk
          mkdir extracted payload
          tar -xzf librsvg.apk -C extracted
          loader='extracted/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader-svg.so'
          test -f "$loader"
          file "$loader"
          readelf -d "$loader" | tee payload/readelf-dynamic.txt
          mkdir -p payload/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders
          cp -a "$loader" payload/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders/
          sha256sum "$loader" > payload/SHA256SUMS

      - name: Upload SVG loader
        uses: actions/upload-artifact@v4
        with:
          name: alpine-v3.20-armv7-libpixbufloader-svg
          path: payload/
          if-no-files-found: error
          retention-days: 7
