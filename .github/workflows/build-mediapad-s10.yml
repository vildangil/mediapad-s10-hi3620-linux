name: Build MediaPad S10 Hi3620 kernel

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version, e.g. 0.1.1 (leave empty for build only)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - mediapad-s10-hi3620
      - pmos-hwbringup-20260909
    paths:
      - 'arch/arm/**'
      - 'drivers/**'
      - 'include/**'
      - 'kernel/**'
      - 'init/**'
      - 'mm/**'
      - 'fs/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/build-mediapad-s10.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabi-

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            bc bison flex libssl-dev make zip unzip

          ${CROSS_COMPILE}gcc --version
          ${CROSS_COMPILE}as --version | head -n 1

      - name: Fix legacy build syntax for modern toolchains
        run: |
          sed -i 's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' \
            scripts/dtc/dtc-lexer.l \
            scripts/dtc/dtc-lexer.lex.c_shipped

          sed -i 's/\.section "\.proc\.info\.init", #alloc/.section ".proc.info.init", "a"/' \
            arch/arm/mm/proc-v7.S
          sed -i 's/\.section "\.start", #alloc, #execinstr/.section ".start", "ax"/' \
            arch/arm/boot/compressed/head.S
          sed -i 's/\.section \.piggydata,#alloc/.section .piggydata,"a"/' \
            arch/arm/boot/compressed/piggy.S

          # Linux 4.9/4.14 RMI4 F11 writes controls back to the wrong base.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('drivers/input/rmi4/rmi_f11.c')
          s = p.read_text()
          old = '&f11->dev_controls, fn->fd.query_base_addr);'
          new = '&f11->dev_controls, fn->fd.control_base_addr);'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 F11 control-base typos, found {count}')
          p.write_text(s.replace(old, new))
          PY

          # Huawei's tablet firmware exposes the BQ27510 command map used by
          # k3_bq27510.c: RemainingCapacity=0x10 and SOC=0x2c.
          if [[ "${GITHUB_REF_NAME}" == "pmos-hwbringup-20260909" ]]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('drivers/power/supply/bq27xxx_battery.c')
          s = p.read_text()
          begin = s.index('\t[BQ27510] = {')
          end = s.index('\n\t[BQ27530] = {', begin)
          block = s[begin:end]
          replacements = {
              '\t\t[BQ27XXX_REG_TTF] = INVALID_REG_ADDR,': '\t\t[BQ27XXX_REG_TTF] = 0x18,',
              '\t\t[BQ27XXX_REG_NAC] = 0x0c,': '\t\t[BQ27XXX_REG_NAC] = 0x10,',
              '\t\t[BQ27XXX_REG_SOC] = 0x20,': '\t\t[BQ27XXX_REG_SOC] = 0x2c,',
              '\t\t[BQ27XXX_REG_DCAP] = 0x2e,': '\t\t[BQ27XXX_REG_DCAP] = INVALID_REG_ADDR,',
          }
          for old, new in replacements.items():
              if block.count(old) != 1:
                  raise SystemExit(f'BQ27510 map anchor mismatch: {old!r}')
              block = block.replace(old, new, 1)
          s = s[:begin] + block + s[end:]
          p.write_text(s)
          PY

            # K3V2 forced-peripheral mode reaches USBRST/ENUMDONE at high
            # speed, but GOTGCTL.BSESVLD never asserts because that signal is
            # supplied by Huawei's missing PMU glue. Before SET_ADDRESS the
            # old driver also has hsotg->connected == 0, so keeping its
            # "connected" guard makes recovery impossible. On this board
            # rearm EP0 on every USB reset regardless of both missing signals.
            # Also preserve a valid SETUP packet count on EP0 OUT. Linux 4.9's
            # generic request path overwrites DOEPTSIZ0 with 0x00080008; the
            # Hi3620 DWC2 then never accepts GET_DESCRIPTOR. SUPCNT=3 yields
            # the expected 0x60080008 SETUP receive state.
            python3 - <<'PY'
          from pathlib import Path
          p = Path('drivers/usb/dwc2/gadget.c')
          s = p.read_text()
          old = ('\t\tif (usb_status & GOTGCTL_BSESVLD && connected)\n'
                 '\t\t\tdwc2_hsotg_core_init_disconnected(hsotg, true);\n')
          new = ('\t\tif ((usb_status & GOTGCTL_BSESVLD && connected) ||\n'
                 '\t\t    of_machine_is_compatible("huawei,s10-101x")) {\n'
                 '\t\t\tif (!(usb_status & GOTGCTL_BSESVLD) &&\n'
                 '\t\t\t    of_machine_is_compatible("huawei,s10-101x"))\n'
                 '\t\t\t\tdev_info_ratelimited(hsotg->dev,\n'
                 '\t\t\t\t\t"HI3620-USB-EP0: USBRST unconditional board rearm BSESVLD=0 connected=%u\\n",\n'
                 '\t\t\t\t\tconnected);\n'
                 '\t\t\tdwc2_hsotg_core_init_disconnected(hsotg, true);\n'
                 '\t\t}\n')
          if s.count(old) != 1:
              raise SystemExit('DWC2 USBRST/BSESVLD anchor mismatch')
          s = s.replace(old, new, 1)

          anchor = ('\tdev_dbg(hsotg->dev,\n'
                    '\t\t"ctrl Type=%02x, Req=%02x, V=%04x, I=%04x, L=%04x\\n",\n'
                    '\t\tctrl->bRequestType, ctrl->bRequest, ctrl->wValue,\n'
                    '\t\tctrl->wIndex, ctrl->wLength);\n')
          extra = (anchor + '\n'
                   '\tif (of_machine_is_compatible("huawei,s10-101x"))\n'
                   '\t\tdev_info_ratelimited(hsotg->dev,\n'
                   '\t\t\t"HI3620-USB-EP0: setup type=%02x req=%02x value=%04x index=%04x len=%04x\\n",\n'
                   '\t\t\tctrl->bRequestType, ctrl->bRequest,\n'
                   '\t\t\tle16_to_cpu(ctrl->wValue), le16_to_cpu(ctrl->wIndex),\n'
                   '\t\t\tle16_to_cpu(ctrl->wLength));\n')
          if s.count(anchor) != 1:
              raise SystemExit('DWC2 SETUP log anchor mismatch')
          s = s.replace(anchor, extra, 1)

          req_anchor = ('\tif (dir_in && index != 0)\n'
                        '\t\tif (hs_ep->isochronous)\n'
                        '\t\t\tepsize = DXEPTSIZ_MC(packets);\n'
                        '\t\telse\n'
                        '\t\t\tepsize = DXEPTSIZ_MC(1);\n'
                        '\telse\n'
                        '\t\tepsize = 0;\n')
          req_fix = ('\tif (dir_in && index != 0)\n'
                     '\t\tif (hs_ep->isochronous)\n'
                     '\t\t\tepsize = DXEPTSIZ_MC(packets);\n'
                     '\t\telse\n'
                     '\t\t\tepsize = DXEPTSIZ_MC(1);\n'
                     '\telse if (!dir_in && index == 0 &&\n'
                     '\t\t of_machine_is_compatible("huawei,s10-101x") &&\n'
                     '\t\t hsotg->ep0_state == DWC2_EP0_SETUP)\n'
                     '\t\tepsize = DXEPTSIZ_MC(3);\n'
                     '\telse\n'
                     '\t\tepsize = 0;\n')
          if s.count(req_anchor) != 1:
              raise SystemExit('DWC2 EP0 request-size anchor mismatch')
          s = s.replace(req_anchor, req_fix, 1)
          p.write_text(s)
          PY

            # Keep the TPS probe instrumentation available for later isolated
            # GPU-DCDC tests. There is currently no TPS node in the safe DT,
            # so this code is dormant in normal MediaPad boots.
            python3 - <<'PY'
          from pathlib import Path
          p = Path('drivers/regulator/tps62360-regulator.c')
          s = p.read_text()
          anchor = ('\ttps->regmap = devm_regmap_init_i2c(client, &tps62360_regmap_config);\n'
                    '\tif (IS_ERR(tps->regmap)) {\n')
          if s.count(anchor) != 1:
              raise SystemExit('TPS62360 regmap anchor mismatch')
          end_anchor = ('\t\treturn ret;\n'
                        '\t}\n'
                        '\ti2c_set_clientdata(client, tps);\n')
          repl = ('\t\treturn ret;\n'
                  '\t}\n'
                  '\tif (of_machine_is_compatible("huawei,s10-101x")) {\n'
                  '\t\tunsigned int raw_id;\n'
                  '\t\tret = regmap_read(tps->regmap, REG_CHIPID, &raw_id);\n'
                  '\t\tdev_info(&client->dev, "HI3620-GPU-DCDC: TPS6236x id rc=%d raw=%02x\\n",\n'
                  '\t\t\t ret, ret ? 0 : raw_id);\n'
                  '\t}\n'
                  '\ti2c_set_clientdata(client, tps);\n')
          if s.count(end_anchor) != 1:
              raise SystemExit('TPS62360 post-regmap anchor mismatch')
          s = s.replace(end_anchor, repl, 1)
          p.write_text(s)
          PY
          fi

          # MediaPad-specific Etnaviv safety guard: never publish a dead GC0.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('drivers/gpu/drm/etnaviv/etnaviv_gpu.c')
          s = p.read_text()
          inc = '#include <linux/moduleparam.h>\n'
          if '#include <linux/of.h>\n' not in s:
              if inc not in s:
                  raise SystemExit('Etnaviv include anchor not found')
              s = s.replace(inc, inc + '#include <linux/of.h>\n#include <linux/io.h>\n', 1)
          anchor = ('\tgpu->mmio = etnaviv_ioremap(pdev, NULL, dev_name(gpu->dev));\n'
                    '\tif (IS_ERR(gpu->mmio))\n'
                    '\t\treturn PTR_ERR(gpu->mmio);\n')
          guard = (anchor + '\n'
                   '\tif (of_machine_is_compatible("huawei,s10-101x") &&\n'
                   '\t    readl(gpu->mmio + VIVS_HI_CHIP_MODEL) == 0) {\n'
                   '\t\tdev_err(dev, "MediaPad GC4000 identity is still zero; refusing dead DRM component\\n");\n'
                   '\t\treturn -ENODEV;\n'
                   '\t}\n')
          if anchor not in s:
              raise SystemExit('Etnaviv MMIO anchor not found')
          s = s.replace(anchor, guard, 1)
          p.write_text(s)
          PY

      - name: Configure MediaPad Hi3620 kernel
        run: |
          mkdir -p out
          make O=out hi3620_s10_defconfig
          make O=out olddefconfig

          grep -E '^CONFIG_(ARCH_MULTI_V7|ARCH_HISI|ARCH_HI3xxx|CPU_V7|CPU_32v7|SMP|NR_CPUS|ARM_APPENDED_DTB|ARM_ATAG_DTB_COMPAT|SERIAL_AMBA_PL011|SERIAL_AMBA_PL011_CONSOLE|DEBUG_HI3620_UART|WLAN|WIRELESS|CFG80211|BRCMFMAC|BRCMFMAC_SDIO|PWRSEQ_SIMPLE|FW_LOADER|DRM|DRM_ETNAVIV|POWER_SUPPLY|BATTERY_BQ27XXX|BATTERY_BQ27XXX_I2C|REGULATOR_TPS62360|BACKLIGHT_LCD_SUPPORT|BACKLIGHT_CLASS_DEVICE)=' out/.config || true

          grep -q '^CONFIG_ARCH_MULTI_V7=y$' out/.config
          grep -q '^CONFIG_ARCH_HISI=y$' out/.config
          grep -q '^CONFIG_ARCH_HI3xxx=y$' out/.config
          grep -q '^CONFIG_CPU_V7=y$' out/.config
          grep -q '^CONFIG_SMP=y$' out/.config
          grep -q '^CONFIG_NR_CPUS=4$' out/.config
          grep -q '^CONFIG_ARM_APPENDED_DTB=y$' out/.config
          grep -q '^CONFIG_DRM=y$' out/.config
          grep -q '^CONFIG_DRM_ETNAVIV=y$' out/.config
          grep -q '^CONFIG_BATTERY_BQ27XXX=y$' out/.config
          grep -q '^CONFIG_BATTERY_BQ27XXX_I2C=y$' out/.config
          grep -q '^CONFIG_REGULATOR_TPS62360=y$' out/.config
          grep -q '^CONFIG_BACKLIGHT_LCD_SUPPORT=y$' out/.config
          grep -q '^CONFIG_BACKLIGHT_CLASS_DEVICE=y$' out/.config

      - name: Build zImage and MediaPad DTB
        run: |
          make -j"$(nproc)" O=out zImage
          if [[ "${GITHUB_REF_NAME}" == "pmos-hwbringup-20260909" ]]; then
            make -j"$(nproc)" O=out hi3620-s10-101x-hwbringup.dtb
          else
            make -j"$(nproc)" O=out hi3620-s10-101x.dtb
          fi

      - name: Create appended-DTB kernel
        run: |
          mkdir -p artifacts
          cp out/arch/arm/boot/zImage artifacts/zImage
          if [[ "${GITHUB_REF_NAME}" == "pmos-hwbringup-20260909" ]]; then
            cp out/arch/arm/boot/dts/hi3620-s10-101x-hwbringup.dtb artifacts/hi3620-s10-101x.dtb
          else
            cp out/arch/arm/boot/dts/hi3620-s10-101x.dtb artifacts/hi3620-s10-101x.dtb
          fi
          cat artifacts/zImage artifacts/hi3620-s10-101x.dtb > artifacts/zImage-dtb
          cp out/.config artifacts/kernel.config
          make -s O=out kernelrelease > artifacts/kernel.release
          sha256sum artifacts/* | tee artifacts/SHA256SUMS

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediapad-s10-hi3620-kernel-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Create release archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euxo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 2
          fi
          (cd artifacts && zip -9 -r ../kernel.zip .)
          unzip -l kernel.zip
          sha256sum kernel.zip

      - name: Publish GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: Linux Kernel for Huawei MediaPad 10 FHD ${{ inputs.release_version }}
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: true
          files: kernel.zip
