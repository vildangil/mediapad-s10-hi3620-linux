name: Build MediaPad S10 Hi3620 kernel

on:
  workflow_dispatch:
  push:
    branches:
      - mediapad-s10-hi3620
    paths:
      - 'arch/arm/**'
      - 'drivers/**'
      - 'include/**'
      - 'kernel/**'
      - 'init/**'
      - 'mm/**'
      - 'fs/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/build-mediapad-s10.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabi-

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            bc bison flex libssl-dev make

          ${CROSS_COMPILE}gcc --version
          ${CROSS_COMPILE}as --version | head -n 1

      - name: Fix legacy build syntax for modern toolchains
        run: |
          # Linux 4.9's bundled DTC defines yylloc in both the lexer and
          # parser. GCC 10+ defaults to -fno-common, so the host linker
          # rejects the duplicate symbol. Keep the parser definition and
          # make the lexer declaration extern, matching newer kernels.
          sed -i 's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' \
            scripts/dtc/dtc-lexer.l \
            scripts/dtc/dtc-lexer.lex.c_shipped

          grep -n 'YYLTYPE yylloc' \
            scripts/dtc/dtc-lexer.l \
            scripts/dtc/dtc-lexer.lex.c_shipped

          # Old ARM assembly used `#alloc` / `#execinstr` ELF section flags.
          # Modern GNU as treats `#` as the start of an ARM comment and
          # rejects these directives. Use the equivalent quoted flags.
          sed -i 's/\.section "\.proc\.info\.init", #alloc/.section ".proc.info.init", "a"/' \
            arch/arm/mm/proc-v7.S
          sed -i 's/\.section "\.start", #alloc, #execinstr/.section ".start", "ax"/' \
            arch/arm/boot/compressed/head.S
          sed -i 's/\.section \.piggydata,#alloc/.section .piggydata,"a"/' \
            arch/arm/boot/compressed/piggy.S

          grep -n '\.proc\.info\.init' arch/arm/mm/proc-v7.S
          grep -n '\.section "\.start"' arch/arm/boot/compressed/head.S
          grep -n '\.piggydata' arch/arm/boot/compressed/piggy.S

      - name: Configure MediaPad Hi3620 kernel
        run: |
          mkdir -p out
          make O=out hi3620_s10_defconfig
          make O=out olddefconfig

          # Sanity checks: this build must stay on the Hi3620-only path and
          # keep the compatibility/debug options needed for first boot.
          grep -q '^CONFIG_ARCH_MULTI_V7=y$' out/.config
          grep -q '^CONFIG_ARCH_HISI=y$' out/.config
          grep -q '^CONFIG_ARCH_HI3xxx=y$' out/.config
          grep -q '^CONFIG_CPU_V7=y$' out/.config
          grep -q '^CONFIG_CPU_32v7=y$' out/.config
          grep -q '^CONFIG_SMP=y$' out/.config
          grep -q '^CONFIG_NR_CPUS=4$' out/.config
          grep -q '^CONFIG_ARM_APPENDED_DTB=y$' out/.config
          grep -q '^CONFIG_ARM_ATAG_DTB_COMPAT=y$' out/.config
          grep -q '^CONFIG_SERIAL_AMBA_PL011=y$' out/.config
          grep -q '^CONFIG_SERIAL_AMBA_PL011_CONSOLE=y$' out/.config
          grep -q '^CONFIG_DEBUG_HI3620_UART=y$' out/.config

          grep -E '^CONFIG_(ARCH_MULTI_V7|ARCH_HISI|ARCH_HI3xxx|CPU_V7|CPU_32v7|SMP|NR_CPUS|ARM_APPENDED_DTB|ARM_ATAG_DTB_COMPAT|SERIAL_AMBA_PL011|SERIAL_AMBA_PL011_CONSOLE|DEBUG_HI3620_UART)=' out/.config

      - name: Build zImage and MediaPad DTB
        run: |
          make -j"$(nproc)" O=out zImage

          # Build this DTB explicitly so bring-up does not depend on the
          # generic DTB list while the board support is still experimental.
          make -j"$(nproc)" O=out arch/arm/boot/dts/hi3620-s10-101x.dtb

      - name: Create appended-DTB kernel
        run: |
          mkdir -p artifacts
          cp out/arch/arm/boot/zImage artifacts/zImage
          cp out/arch/arm/boot/dts/hi3620-s10-101x.dtb artifacts/hi3620-s10-101x.dtb
          cat artifacts/zImage artifacts/hi3620-s10-101x.dtb > artifacts/zImage-dtb
          cp out/.config artifacts/kernel.config
          sha256sum artifacts/* | tee artifacts/SHA256SUMS

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediapad-s10-hi3620-kernel-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
